name: Update profile cards

on:
  schedule:
    - cron: "17 0 * * *" # every day, about 05:47 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - data/profile.json
      - scripts/**

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch contributions
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_github.py

      - name: Render README cards
        run: python scripts/render_cards.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data cards
          git diff --staged --quiet || git commit -m "chore: refresh profile cards"
          git push
